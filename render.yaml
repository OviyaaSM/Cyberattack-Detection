services:
  - type: web
    name: temporal-cyberattack-detection-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.3
      - key: DATABASE_URL
        value: sqlite:///./cyberattack_detection.db
      - key: CORS_ORIGINS
        value: "*"
      - key: AI_PROVIDER
        value: deterministic
      - key: AI_API_KEY
        sync: false
    healthCheckPath: /api/health
